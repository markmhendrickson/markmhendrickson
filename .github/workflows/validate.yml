name: Validate website

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SKIP_WEBSITE_CACHE_REGEN: '1'
      NEOTOMA_SHORT_LINKS_JSON: '{"origin":"https://records.example","links":{"shared-page":"ent_0123456789abcdef01234567"}}'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: react-app/package-lock.json
      - name: Install dependencies
        working-directory: react-app
        run: npm ci
      - name: Test short-link behavior
        working-directory: react-app
        run: npm run test:short-links
      - name: Build and verify site
        working-directory: react-app
        run: npm run build:ci
      - name: Check short links remain outside discovery files
        working-directory: react-app
        run: |
          test -f dist/l/shared-page/index.html
          if rg -l '/l/shared-page|records\.example' dist/sitemap.xml dist/rss.xml dist/llms-full.txt; then
            echo 'Short-link configuration leaked into discovery files.'
            exit 1
          fi
